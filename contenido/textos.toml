es = """
Como responsable de la identidad visual, tomo las decisiones de marca y valido su uso en todo lo que comunica la compañía en Argentina, Uruguay, Perú y Estados Unidos. Diseño campañas, mailings, presentaciones comerciales, contenido para redes, video y gráfica. Desde marketing trabajo con comercial y producto, y doy dirección de arte y feedback a agencias, productoras y demás proveedores externos. Lideré el diseño del sitio institucional y coordiné su desarrollo entre las distintas áreas involucradas. También ideé un sistema automatizado para que los asesores compartan piezas con su propia marca, y desarrollé procesos con IA para agilizar la producción. Creé la identidad de los principales eventos de la compañía con sus clientes: los kickoffs y los cocktails de fin de año en Argentina y Perú."""
