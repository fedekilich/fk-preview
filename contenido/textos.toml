# ─── About ───────────────────────────────────────────────────────────────

[ui.about.eyebrow]
nota = "Volanta de About."
es = "About"
en = "About"

[ui.about.title]
nota = "Titular de About (h1). Se corta a ~16 caracteres por línea: conviene que sea corto."
es = "15 años conectando diseño, motion y marca."
en = "15 years connecting design, motion, and brand."

[ui.about.name]
nota = "Tu nombre, abajo del titular de About, alineado a la izquierda."
es = "Fede Kilich"
en = "Fede Kilich"

[ui.about.role]
nota = "Tu rol, abajo del titular de About, alineado a la derecha. Enfrenta al nombre."
es = "Design Lead · Brand & Motion"
en = "Design Lead · Brand & Motion"

[ui.about.photoAlt]
nota = "Descripción de tu foto de About para quien no la ve (lectores de pantalla, imagen rota). No se muestra en pantalla."
es = "Fede Kilich sentado, mirando a cámara."
en = "Fede Kilich seated, looking at the camera."

[ui.about.quote]
nota = "Frase destacada de About, en grande y en color de acento. Es la idea que resume todo el bio."
es = "Una visión 360° del diseño, el motion y la marca."
en = "A 360° view of design, motion, and brand."

[ui.about.p1]
nota = "Primer párrafo de About: cómo empezaste y de dónde viene la curiosidad."
es = """
Llevo más de 15 años trabajando en comunicación visual, y empecé como empiezan muchos: haciendo cosas que nadie me pidió. Wallpapers, sitios en Flash para amigos, experimentando con herramientas que aprendí solo. Esa curiosidad nunca me abandonó."""
en = """
I've spent more than 15 years working in visual communication, and I started the way many people do: making things nobody asked for. Wallpapers, Flash sites for friends, experimenting with tools I taught myself. That curiosity never left me."""

[ui.about.p2]
nota = "Segundo párrafo de About: el recorrido por productoras, agencias, gobierno y fintech, y qué te dejó cada uno."
es = """
Con los años pasé por productoras, agencias de publicidad, comunicaciones de gobierno y fintech. Cada entorno me enseñó algo distinto: la productora me dio tiempo y libertad para desarrollar profundidad técnica en 3D, motion, edición y posproducción. Las agencias me enseñaron ritmo, presión y lo que significa trabajar para un cliente real con un deadline real. El gobierno me dio escala: coordinar un equipo de más de 10 diseñadores para comunicar a millones de personas en uno de los momentos más complejos que se recuerdan. Y la fintech me enseñó disciplina: trabajar dentro de sistemas de marca estrictos y comunicar conceptos financieros complejos con claridad visual."""
en = """
Over the years I moved through production companies, advertising agencies, government communications, and fintech. Each environment taught me something different: the production company gave me time and freedom to build technical depth in 3D, motion, editing, and post-production. The agencies taught me pace, pressure, and what it means to work for a real client with a real deadline. Government gave me scale: coordinating a team of more than 10 designers to communicate with millions of people during one of the most complex moments in recent memory. And fintech taught me discipline: working inside strict brand systems and communicating complex financial concepts with visual clarity."""

[ui.about.p3]
nota = "Tercer párrafo de About: qué conecta todo eso. Es el argumento central del posicionamiento."
es = """
Lo que conecta todo eso es una visión 360° de la comunicación visual. No soy especialista en una sola disciplina, soy alguien que entiende cómo el diseño, el motion y la marca funcionan juntos, y cómo liderar un equipo que cubre todo ese espectro."""
en = """
What connects all of it is a 360° view of visual communication. I'm not a specialist in a single discipline — I'm someone who understands how design, motion, and brand work together, and how to lead a team that covers that whole spectrum."""

[ui.about.p4]
nota = "Cuarto párrafo de About: qué aportás en un rol de liderazgo. Cierra apuntando a lo que busca quien contrata."
es = """
Eso es lo que aporto en un rol de liderazgo. No solo la capacidad de hacer el trabajo, sino de entender qué se necesita, distribuirlo bien, y asegurar que el resultado sea coherente, ya sea en una vía pública, una red social, un video o una pantalla."""
en = """
That's what I bring to a leadership role. Not just the ability to do the work, but to understand what's needed, distribute it well, and make sure the result holds together — whether it lands on a billboard, a social feed, a video, or a screen."""

[ui.about.timelineTitle]
nota = "Título de la sección de recorrido profesional en About."
es = "Recorrido"
en = "Career path"


