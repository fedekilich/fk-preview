nota = "Una línea sobre esa etapa, siempre visible bajo el título."
es = "Piezas de campaña y comunicación institucional para la Ciudad."
en = "Campaign pieces and institutional communication for the City."

[hito.gcbaDesigner.expanded]
nota = "El detalle que se despliega al abrir el hito: qué hacías y qué se logró ahí."
es = """
Diseñé piezas para campañas de concientización, eventos culturales y comunicación institucional, en digital e impreso, incluyendo vía pública y gran formato. Trabajé en la presentación del nuevo Código Urbanístico de Buenos Aires (2019) y participé en la comunicación de los Juegos Olímpicos de la Juventud 2018."""
en = """
I designed pieces for awareness campaigns, cultural events, and institutional communication, across digital and print, including outdoor and large-format work. I worked on the presentation of the new Buenos Aires Urban Code (2019) and took part in the communication for the 2018 Youth Olympic Games."""


