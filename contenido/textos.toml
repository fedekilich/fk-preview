# ─── About ───────────────────────────────────────────────────────────────

[ui.about.eyebrow]
nota = "Volanta de About."
es = "About"
en = "About"

[ui.about.title]
nota = "Titular de About (h1). Se corta a ~16 caracteres por línea. El espacio entre «las» y «marcas.» es duro (no se parte): evita que «marcas.» quede sola en la última línea."
es = "Más de 15 años haciendo lucir la identidad de las marcas."
en = ""

[ui.about.name]
nota = "Tu nombre, abajo del titular de About, alineado a la izquierda."
es = "Fede Kilich"
en = "Fede Kilich"

[ui.about.role]
nota = "Tu rol, abajo del titular de About, alineado a la derecha. Enfrenta al nombre. Es el único lugar visible del sitio donde dice Design Lead."
es = "Design Lead · Brand, Motion & IA"
en = ""

[ui.about.photoAlt]
nota = "Descripción de tu foto de About para quien no la ve (lectores de pantalla, imagen rota). No se muestra en pantalla."
es = "Fede Kilich sentado, mirando a cámara."
en = "Fede Kilich seated, looking at the camera."

[ui.about.p1]
nota = "Primer párrafo de About: el recorrido como punto de partida."
es = """
Mi trayectoria en el diseño y la comunicación visual me llevó por distintos entornos, industrias y disciplinas, y cada etapa fue ampliando mi forma de entender el diseño y lo que puede hacer por una marca."""
en = ""

[ui.about.p2]
nota = "Segundo párrafo de About: qué le dejó cada entorno (productoras, agencias, gobierno, financiero)."
es = """
Las productoras me dieron profundidad técnica y el lenguaje audiovisual; las agencias, ritmo y capacidad de resolver bajo presión; la comunicación de gobierno, escala y gestión de equipos y proyectos, incluso en contextos críticos como la pandemia; y el sector financiero, claridad y consistencia para comunicar temas complejos."""
en = ""

[ui.about.p3]
nota = "Tercer párrafo de About: versatilidad, visión integral y el lugar de la IA. Es el argumento central del posicionamiento."
es = """
Hoy, todo eso se traduce en versatilidad y en una visión integral de la comunicación visual, lo que me permite entender qué necesita cada proyecto, definir el criterio y coordinar el trabajo de equipos internos y externos, sin dejar de participar directamente en el diseño. En ese mismo camino incorporé la inteligencia artificial, que uso para automatizar procesos y ampliar la producción a partir de universos de marca bien definidos, sin perder el control creativo."""
en = ""

[ui.about.p4]
nota = "Cuarto párrafo de About: qué aporta en cada caso. Cierra con el objetivo."
es = """
Esa mezcla de oficio, gestión y criterio es lo que aporto en cada caso, ya sea liderando un equipo o en un trabajo puntual. Mi objetivo es ordenar y fortalecer la comunicación visual de cada marca, y lograr que refleje su esencia, lo que realmente es."""
en = ""

[ui.about.timelineTitle]
nota = "Título de la sección de recorrido profesional en About."
es = "Recorrido"
en = "Career path"


