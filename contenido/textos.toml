# ─── 1. Antarctica Films   ·   id: antarctica ────────────────────────────

[hito.antarctica.period]
nota = "Años del hito. Se muestra arriba del título, en versalitas."
es = "2006–2014"
en = "2006–2014"

[hito.antarctica.title]
nota = "Nombre del lugar o del rol. Es el botón que despliega el detalle."
es = "Antarctica Films"
en = "Antarctica Films"

[hito.antarctica.teaser]
nota = "Una línea sobre esa etapa, siempre visible bajo el título."
es = "Motion, 3D y posproducción para TV. Ahí aprendí el oficio."
en = "Motion, 3D, and post-production for TV. That's where I learned the craft."

[hito.antarctica.expanded]
nota = "El detalle que se despliega al abrir el hito: qué hacías y qué se logró ahí."
es = """
Entré como Motion Designer y 3D Artist, después pasé a coordinar el equipo. Piezas para cable (bumpers, cortinas, transiciones), motion, 3D y posproducción en cada entrega. Con los años empecé a organizar cronogramas y liderar proyectos clave del equipo."""
en = """
I started as a Motion Designer and 3D Artist, later moving into team coordination. Pieces for cable TV (bumpers, lower thirds, transitions), motion, 3D, and post-production on every delivery. Over time I started organizing schedules and leading key projects for the team."""


# ─── 2. Ideapolis   ·   id: ideapolis ────────────────────────────────────

[hito.ideapolis.period]
nota = "Años del hito. Se muestra arriba del título, en versalitas."
es = "2014–2016"
en = "2014–2016"

[hito.ideapolis.title]
nota = "Nombre del lugar o del rol. Es el botón que despliega el detalle."
es = "Ideapolis"
en = "Ideapolis"

[hito.ideapolis.teaser]
nota = "Una línea sobre esa etapa, siempre visible bajo el título."
es = "3D para activaciones de marca: stands, ferias, puntos de venta."
en = "3D for brand activations: stands, trade shows, points of sale."

[hito.ideapolis.expanded]
nota = "El detalle que se despliega al abrir el hito: qué hacías y qué se logró ahí."
es = """
Diseñé, modelé y rendericé espacios físicos para activaciones en ferias y puntos de venta. Esas visualizaciones eran tanto para mostrarle la idea al cliente como guía técnica para arquitectos y proveedores. El stand del Banco Central en Tecnópolis, ganado por concurso, es lo que más recuerdo de esta etapa."""
en = """
I designed, modeled, and rendered physical spaces for activations at trade shows and points of sale. Those visualizations worked both to show the client the idea and as technical guides for architects and vendors. The Central Bank's stand at Tecnópolis, won through a competitive bid, is what I remember most from this stage."""


# ─── 3. Al Margen BA   ·   id: almargen ──────────────────────────────────

[hito.almargen.period]
nota = "Años del hito. Se muestra arriba del título, en versalitas."
es = "2016–2017"
en = "2016–2017"

[hito.almargen.title]
nota = "Nombre del lugar o del rol. Es el botón que despliega el detalle."
es = "Al Margen BA"
en = "Al Margen BA"

[hito.almargen.teaser]
nota = "Una línea sobre esa etapa, siempre visible bajo el título."
es = "Motion graphics para publicidad. Un año de mucho ritmo."
en = "Motion graphics for advertising. A fast-paced year."

[hito.almargen.expanded]
nota = "El detalle que se despliega al abrir el hito: qué hacías y qué se logró ahí."
es = """
Motion graphics, animación 3D y compositing para campañas digitales y de TV, con clientes como Despegar, ICBC y Garbarino. También sumé posproducción de cine: correcciones visuales de época para la película El Ángel (2018), con rotoscopía y motion tracking."""
en = """
Motion graphics, 3D animation, and compositing for digital and TV campaigns, with clients like Despegar, ICBC, and Garbarino. I also picked up film post-production: period-accurate visual corrections for the film El Ángel (2018), using rotoscoping and motion tracking."""


# ─── 4. GCBA — Diseñador   ·   id: gcbaDesigner ──────────────────────────

[hito.gcbaDesigner.period]
nota = "Años del hito. Se muestra arriba del título, en versalitas."
