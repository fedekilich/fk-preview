<body class="theme-lab">

<a class="skip-link" href="#main" data-i18n="nav.skip">Saltar al contenido</a>

<header class="site-header">
  <div class="shell site-header__inner">
    <a class="wordmark" href="index.html">Fede Kilich<span>.</span></a>
    <nav class="site-nav" data-i18n-aria-label="nav.primary" aria-label="Navegación principal">
      <a class="site-nav__link" href="about.html" data-i18n="nav.about">About</a>
      <a class="site-nav__link" href="all-work.html" data-i18n="nav.work">Work</a>
      <a class="site-nav__link" href="contact.html" data-i18n="nav.contact">Contact</a>
      <a class="site-nav__link site-nav__link--lab" href="lab.html" aria-current="page" data-text="lab" data-i18n="nav.lab">lab</a>
      <button type="button" class="lang-toggle" data-i18n-aria-label="nav.langLabel" aria-label="Cambiar idioma a inglés">
        <span class="lang-toggle__opt is-active" data-lang="es">ES</span>
        <span aria-hidden="true">/</span>
        <span class="lang-toggle__opt" data-lang="en">EN</span>
      </button>
    </nav>
  </div>
</header>

<main id="main">

  <!-- El experimento se resuelve desde ?item=<id> en assets/js/lab-work.js -->
  <div class="shell not-found" id="not-found" hidden>
    <h1 class="display not-found__title" data-i18n="lab.notFound">No encontramos ese experimento.</h1>
    <a class="btn-ghost" href="lab.html">
      <span data-i18n="lab.notFoundCta">Volver al lab</span><span aria-hidden="true">→</span>
    </a>
  </div>

  <article id="item" hidden>
    <header class="shell detail__head">
      <span class="eyebrow detail__client" id="item-client"></span>
      <h1 class="display detail__title" id="item-title"></h1>
      <p class="detail__line" id="item-line"></p>
    </header>

    <div class="shell detail__cover" id="item-cover"></div>

    <div class="shell">
      <dl class="detail__facts">
        <div>
          <dt data-i18n="work.role">Rol</dt>
          <dd id="fact-role">—</dd>
        </div>
        <div>
          <dt data-i18n="work.period">Período</dt>
          <dd id="fact-period">—</dd>
        </div>
      </dl>
    </div>

    <div class="shell detail__narrative">
      <p id="item-narrative"></p>
    </div>

    <div class="shell detail__gallery" id="item-gallery"></div>

    <nav class="shell detail__nav" data-i18n-aria-label="lab.title" aria-label="Lab">
      <a class="detail__back" href="lab.html">← <span data-i18n="lab.back">Volver al lab</span></a>
      <a class="detail__next" id="item-next" href="#">
        <span class="detail__next-label" data-i18n="lab.next">Siguiente experimento</span>
        <strong class="detail__next-title" id="item-next-title"></strong>
      </a>
    </nav>
  </article>

</main>

<footer class="site-footer">
  <div class="shell site-footer__inner">
    <nav class="site-footer__nav" data-i18n-aria-label="nav.footer" aria-label="Navegación del pie">
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="all-work.html" data-i18n="nav.work">Work</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
      <a class="is-lab" href="lab.html">Lab</a>
    </nav>
    <div class="site-footer__links">
      <a href="contact.html">hola@fedekilich.com</a>
      <a href="https://www.linkedin.com/in/fedekilich" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <span class="site-footer__meta">
      <span data-i18n="footer.rights">© 2026 Fede Kilich</span> —
      <span data-i18n="footer.location">Buenos Aires, Argentina</span>
    </span>
  </div>
</footer>

<script type="module" src="assets/js/lab-work.js"></script>
</body>
</html>
