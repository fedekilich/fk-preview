  <section class="shell shell--narrow contact">
    <div class="contact__list">
      <!-- Click-to-copy, no mailto (PRD §5.6) -->

        <span class="contact__label">
          <span data-i18n="contact.emailLabel">Email</span>
          <span class="contact__status" id="copy-status" role="status" aria-live="polite"></span>
        </span>
        <!-- TODO: email definitivo pendiente de confirmar (PRD §5.6) -->
        <span class="contact__value" id="email-value">hola@fedekilich.com</span>
      </button>

      <a class="contact__row contact__row--last" href="https://www.linkedin.com/in/fedekilich" target="_blank" rel="noopener">
        <span class="contact__label" data-i18n="contact.linkedinLabel">LinkedIn</span>
        <span class="contact__value">/in/fedekilich</span>

    </div>

    <p class="contact__based" data-i18n="contact.based">Buenos Aires, Argentina. Remotamente para el mundo.</p>
