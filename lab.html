<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="theme-lab">

<div class="lab-cut" aria-hidden="true"></div>

<a class="skip-link" href="#main" data-i18n="nav.skip">Saltar al contenido</a>

<!-- .lab-stage: lo que el glitch clona y oculta durante la transición -->
<div class="lab-stage">

  <!-- Fondo de toda la página: el mismo video del hero detrás de un vidrio
       esmerilado. Va en 720 y no en 1080 porque el desenfoque se come el
       detalle y pesa la mitad. -->
  <div class="lab-bg" aria-hidden="true">
    <video class="lab-bg__video" autoplay muted loop playsinline preload="auto"
           disablepictureinpicture tabindex="-1"
           poster="assets/video/hero_masa_poster.webp">
      <source src="assets/video/hero_masa_720.webm" type="video/webm">
      <source src="assets/video/hero_masa_720.mp4" type="video/mp4">
    </video>
    <span class="lab-bg__glass"></span>
  </div>

<header class="site-header">
  <div class="shell site-header__inner">
    <a class="wordmark" href="index.html">Fede Kilich<span>.</span></a>
    <nav class="site-nav" data-i18n-aria-label="nav.primary" aria-label="Navegación principal">
      <a class="site-nav__link" href="about.html" data-i18n="nav.about">About</a>
      <a class="site-nav__link" href="all-work.html" data-i18n="nav.work">Work</a>
      <a class="site-nav__link" href="contact.html" data-i18n="nav.contact">Contact</a>
      <a class="site-nav__link site-nav__link--lab" href="lab.html" aria-current="page" data-text="lab" data-i18n="nav.lab">lab</a>
      <button type="button" class="lang-toggle" data-i18n-aria-label="nav.langLabel" aria-label="Cambiar idioma a inglés">
        <span class="lang-toggle__opt is-active" data-lang="es">ES</span>
        <span aria-hidden="true">/</span>
        <span class="lang-toggle__opt" data-lang="en">EN</span>
      </button>
    </nav>
  </div>
</header>

<main id="main">

  <section class="shell page-hero">
    <span class="eyebrow page-hero__eyebrow lab-flicker" data-i18n="lab.eyebrow">Experimentando</span>
    <h1 class="display page-hero__title lab-flicker"><span data-i18n="lab.title">Lab</span><span class="lab-caret" aria-hidden="true">_</span></h1>
    <p class="page-hero__intro lab-flicker lab-flicker--late" data-i18n="lab.intro">Ganas de crear, probar, experimentar. De ahí salen estos proyectos, sin clientes ni deadlines.</p>
  </section>

  <!-- Mientras no haya experimentos cargados, en lugar de la grilla va el
       "Próximamente". Para devolver la grilla alcanza con reponer el markup
       de abajo: los datos siguen en data/lab.json y lab.js los sabe dibujar.
         <section class="shell lab-list">
           <div class="lab-grid" id="lab-items"></div>
         </section>
  -->
  <section class="shell lab-soon">
    <p class="lab-soon__label">
      <span class="lab-soon__word" data-i18n="lab.soon">Próximamente</span>
      <!-- Las copias del glitch viven acá, fuera del alcance de un lector de
           pantalla: el texto de verdad es el span de arriba. El data-text lo
           sincroniza assets/js/lab.js, que también lo actualiza al cambiar
           de idioma. -->
      <span class="lab-soon__glitch" aria-hidden="true"></span>
    </p>
  </section>

</main>

<footer class="site-footer">
  <div class="shell site-footer__inner">
    <nav class="site-footer__nav" data-i18n-aria-label="nav.footer" aria-label="Navegación del pie">
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="all-work.html" data-i18n="nav.work">Work</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
      <a class="is-lab" href="lab.html">Lab</a>
    </nav>
    <div class="site-footer__links">
      <a href="contact.html">hola@fedekilich.com</a>
      <a href="https://www.linkedin.com/in/fedekilich" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    <span class="site-footer__meta">
      <span data-i18n="footer.rights">© 2026 Fede Kilich</span> —
      <span data-i18n="footer.location">Buenos Aires, Argentina</span>
    </span>
  </div>
</footer>

</div><!-- /.lab-stage -->

<script type="module" src="assets/js/lab.js"></script>
</body>
</html>
